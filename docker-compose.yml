services:
  postgres:
    image: postgres:15-alpine
    container_name: tnews-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tnews_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tnews_password}
      POSTGRES_DB: ${POSTGRES_DB:-tnews}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tnews_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tnews-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tnews-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tnews_user}:${POSTGRES_PASSWORD:-tnews_password}@postgres:5432/${POSTGRES_DB:-tnews}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    networks:
      - tnews-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tnews-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - tnews-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  tnews-network:
    name: tnews-network
